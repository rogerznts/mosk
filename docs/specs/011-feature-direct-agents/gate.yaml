schema: 1
story: "011"
story_title: "Agentes diretos — o template ship a camada de agentes"
gate: CONCERNS
quality_score: 70
status_reason: >-
  Os 21 requisitos funcionais passam, verificados contra o disco e — onde o grep
  daria falso negativo — por teste funcional. O gap que motivou a spec está
  fechado: o consumidor recebe 12 agentes invocáveis, e a invocação por
  `subagent_type` foi comprovada nesta rodada (SC-003). Restam três verificações
  pendentes, nenhuma indicando defeito: o formato de branch exercitado ponta a
  ponta, o transporte do degit, e a independência deste próprio gate.
reviewer: "Joaquim (mosk-qa)"
updated: "2026-08-05T23:05:00Z"

waiver: { active: false }

top_issues:
  - id: "QA-011-002"
    severity: medium
    finding: >-
      SC-005 parcial. O código do formato novo está correto — teste funcional
      confirma `feature/012-algo` como branch e `012-feature-algo` como pasta —
      mas nenhuma spec foi criada com ele. A própria 011 nasceu no formato
      legado, por decisão registrada (ela implementa o formato). O caminho
      completo (criar branch, resolver spec ativa, rodar uma fase) nunca correu.
    suggested_action: >-
      A spec 012 é o teste natural: nasce no formato novo e exercita criação,
      resolução e fase numa passada só.
  - id: "QA-011-003"
    severity: medium
    finding: >-
      O smoke de instalação (T019) simulou o degit copiando `mosk/.`, porque o
      degit real puxa do remoto e o trabalho não está pushado. É fiel ao
      CONTEÚDO que o consumidor receberia — 12 agentes com front-matter válido,
      zero caminhos quebrados — mas não exercita o transporte.
    suggested_action: >-
      Depois do merge, rodar `npx degit rogerznts/mosk/mosk .` num diretório
      limpo e repetir as mesmas quatro checagens.
  - id: "QA-011-004"
    severity: medium
    finding: >-
      Gate emitido pelo mesmo contexto que implementou a spec — a condição que a
      010 definiu como não-confiável. Compensado com verificação mecânica contra
      o disco, e a compensação provou seu valor: dois FRs deram falso negativo no
      grep e passaram no teste funcional. Ainda assim, o julgamento de severidade
      permanece do autor.
    suggested_action: "Re-emitir de contexto limpo (subagente ou sessão nova)."
  - id: "QA-011-005"
    severity: low
    finding: >-
      O espelho local `.claude/mosk/` segue defasado do template nos 20+ arquivos
      herdados da 010 (QA-010-004). A camada de agentes foi sincronizada nesta
      spec; o resto não. Fora de escopo declarado.
    suggested_action: "Item próprio, como já recomendado no gate da 010."

