resolved_in_this_round:
  - id: "QA-011-001"
    note: >-
      SC-003 fechado, e a hipótese que o sustentava estava ERRADA. Eu havia
      afirmado que a invocação exigiria sessão nova; o runtime fixa a LISTA de
      tipos na inicialização, mas relê a DEFINIÇÃO do agente a cada spawn. Um
      `mosk-dev` invocado agora respondeu com a seção de invocação (M1 desta
      spec), caminhos `.claude/mosk/tasks/` (M1) e a regra de registrar-sem-julgar
      (spec 010 US2) — com `tool_uses: 0`, provando que veio da definição
      carregada e não de leitura de disco.

