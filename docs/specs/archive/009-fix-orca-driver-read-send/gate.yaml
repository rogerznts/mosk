top_issues:
  - id: "QA-009-007"
    severity: low
    finding: >-
      Envios de até 3 caracteres caem no modo fraco (confirma por qualquer mudança
      de tela). Numa TUI de agente, que muda sozinha o tempo todo, isso significa
      que um envio curto é efetivamente NÃO verificado — e o `orq.md` usa
      exatamente essa forma para resolver prompt de MCP/trust ("no Orca,
      `panes.sh send` já basta"). Consequência: o Mauro pode achar que respondeu
      um prompt de confiança sem ter respondido. Autocorrige na observação
      seguinte (`wait-idle`/`read` mostram o worker ainda parado) e o modo é
      **declarado em stderr** — verifiquei que o aviso sai. Registrado para que
      ninguém leia a garantia do aditivo do ADR-0010 como absoluta.
    suggested_action: >-
      Nada nesta spec. Se algum dia importar, o sinal certo para keystroke é o
      desaparecimento do prompt que se queria responder, não a mudança de tela.
    refs: ["mosk/.claude/mosk/scripts/orca.sh (_delivery_confirmed, modo fraco)"]

  - id: "QA-009-004"
    severity: low
    finding: >-
      Deriva de mirror PRÉ-EXISTENTE, mantida fora do 009 por instrução minha e
      corretamente não tocada em nenhuma das duas rodadas: `payload-deploy.sh`,
      `payload-env.sh`, `payload-infra.sh` e `agents/qa.md` (falta a seção
      `## Idioma`) diferem entre `mosk/.claude/mosk/` e o mirror da raiz.
    suggested_action: "Spec/chore própria para varrer a paridade do mirror."
    refs: [".claude/mosk/scripts/payload-*.sh", ".claude/mosk/agents/qa.md"]

  - id: "QA-009-008"
    severity: low
    finding: "Nit cosmético: `_count_occurrences` declara `haystack` e não usa (usa `rest=\"$1\"`)."
    suggested_action: "Remover na próxima passagem pelo arquivo. Não justifica uma volta do loop."
    refs: ["mosk/.claude/mosk/scripts/orca.sh:470"]

resolved_since_last_gate:
  - id: "QA-009-006"
    severity_was: medium
    verificacao: >-
      Reproduzi meu caso original (`/mosk-zzz-probe-009 …` em TUI): era rc=1, agora
      rc=0. E cobri o que faltava nos dois lados: **slash command VÁLIDO**
      (`/mosk-help`, o caminho de produção que nenhuma das rodadas anteriores havia
      exercitado) → rc=0. A escada de candidatas (prefixo longo → primeiro token →
      16 → piso 8) resolve o eco reformatado sem afrouxar: fixtures `7l` e `7m`
      travam que `/mosk-qa` não confirma envio de `/mosk-dev` e que o prefixo comum
      `/mosk-` não confirma nada.

