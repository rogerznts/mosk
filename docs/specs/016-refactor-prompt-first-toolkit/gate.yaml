    finding: "SC-001 e FR-004 pedem no maximo 1.500 linhas de shell; o resultado e 2.798. A reducao real e de 65% e o objetivo da spec foi cumprido, mas o criterio declarado nao. A meta foi estimada antes de os scripts serem lidos — o mesmo erro aparece tres vezes na spec — e restam apenas ~150 linhas cortaveis sem perda de funcao, o que nao fecha a diferenca."
