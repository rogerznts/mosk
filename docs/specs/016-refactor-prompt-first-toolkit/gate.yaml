  - id: "QA-2"
    severity: "medium"
    finding: "Nada verifica que as tasks seguem o pipeline.yaml. O self-check confere apenas as constantes internas do validate.sh contra o YAML; se uma aresta mudar no arquivo e as seis tasks de fase mantiverem o fluxo antigo, nenhuma verificacao acusa. O AS-4 da US1 foi provado uma vez, manualmente, na T014, sem fixture remanescente."
    suggested_action: "Acrescentar ao validate.sh uma verificacao que extraia fases e arestas do pipeline.yaml e recuse task que cite transicao fora do declarado. Escopo pequeno; fecha o laco da tese central da spec."
