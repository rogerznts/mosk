top_issues:
  - id: "QA-1"
    severity: high
    title: "Uma branch diferente pode resolver e alterar a spec errada"
    finding: "Branches não registradas com o mesmo número, além de metadata com número, tipo e branch divergentes, foram aceitas em Bash e zsh."
    contradicts: 'FR-011 — "o resolvedor aceita número, spec_id ou branch e valida a correspondência com spec-meta.yaml"; SC-004 — "metadata divergente retorna falha"'
    suggested_action: "Classificar o locator por forma, exigir igualdade exata para spec_id/branch e validar número, tipo, spec_id, branch e pasta como uma única identidade."
  - id: "QA-2"
    severity: high
    title: "Um sinal entre as gravações deixa metadata e histórico divergentes"
    finding: "TERM injetado após o mv de spec-meta.yaml retornou erro, mas preservou a nova fase enquanto phase-history.yaml permaneceu na fase anterior."
    contradicts: 'FR-008 — "metadata e histórico são protegidos contra escrita parcial"; SC-002 — "em 100% das falhas simuladas, ambos permanecem byte a byte iguais"'
    suggested_action: "Fazer o trap restaurar os backups quando a primeira promoção já ocorreu e adicionar fixtures de HUP, INT e TERM em Bash e zsh."
  - id: "QA-3"
    severity: high
    title: "Archive confirma estado final com promoção obrigatória pendente"
    finding: "Uma transição qa-gate -> archived retornou sucesso com promote_mode copy apontando para um alvo inexistente; a spec ficou archived e o destino não foi criado."
    contradicts: 'PhaseContract — "archived exige gate válido, evidência presente, tasks completas e promoções satisfeitas"; FR-006 — "cada destino possui pré-condições verificáveis no disco"'
    suggested_action: "Mover a validação única de promoções para a pré-condição de archived e cobrir copy, append, manual, traversal e symlink no selftest de estado."
  - id: "QA-4"
    severity: medium
    title: "Metadata e histórico podem registrar instantes diferentes"
    finding: "last_phase_change divergente do at do último evento foi aceito em Bash e zsh."
    contradicts: 'Cenário US3.1 — "metadata e histórico concordam sobre origem, destino, instante e comando responsável"'
    suggested_action: "Comparar last_phase_change com o timestamp do último evento durante validate_spec_metadata e adicionar uma fixture negativa."
  - id: "QA-5"
    severity: medium
    title: "Esclarecimentos bloqueantes em plan.md não impedem avanço"
    finding: "plan.md com marcador [NEEDS CLARIFICATION: ...] avançou de plan para tasks em Bash e zsh."
    contradicts: 'Edge case da spec — "artefato obrigatório ainda contendo marcador NEEDS CLARIFICATION bloqueante impede a transição"'
    suggested_action: "Aplicar a verificação de marcador a todos os artefatos obrigatórios de cada destino, não apenas a spec.md antes de plan."
  - id: "QA-6"
    severity: medium
    title: "Gate vigente passa sem histórico obrigatório de scores"
    finding: "Gate schema 2 sem score_history foi aceito; o campo também não existe em properties/required do schema declarativo."
    contradicts: 'FR-013 — "gate e waiver possuem schemas versionados com campos obrigatórios"; GateDecision — "a decisão inclui score e histórico de scores"'
    suggested_action: "Adicionar score_history ao JSON Schema e ao validador shell, mantendo compatibilidade explícita apenas para gate histórico schema 1."
  - id: "QA-7"
    severity: medium
    title: "O self-test não percorre a matriz proibida completa"
    finding: "O harness cobre as seis arestas permitidas, mas somente três das 24 combinações proibidas e um dos seis no-ops."
    contradicts: 'SC-001 — "100% das transições permitidas e proibidas possuem fixture"; FR-020 — "self-tests cobrem a matriz completa"'
    suggested_action: "Gerar fixtures sistemáticas para todas as combinações, comandos e no-ops, verificando também imutabilidade byte a byte em cada recusa."
  - id: "QA-8"
    severity: medium
    title: "O espelho local do template de regras está divergente"
    finding: "Dezoito pares modificados coincidem, mas .claude/mosk/templates/project-rule-tmpl.md omite os controles de segurança presentes no produto distribuível."
    contradicts: 'FR-019 — "produto sob mosk/ e espelho local sob .claude/ permanecem equivalentes para toda superfície modificada"'
    suggested_action: "Sincronizar project-rule-tmpl.md do produto para o espelho e tornar a paridade de todos os pares modificados uma asserção permanente."

