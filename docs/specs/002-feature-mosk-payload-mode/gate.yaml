  FR-007_008_provisionamento: { status: verified, evidence: "DB por slug (checa pg_database), Redis 0-15 c/ fallback prefixo, porta bind-test /dev/tcp desde 3000, tudo em registry.yaml. Runtime: 2 projetos com porta/db/redis distintos." }
