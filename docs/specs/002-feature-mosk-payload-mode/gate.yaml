# ---------------------------------------------------------------------------
# Evidência por invariante (INV-1..6) — travadas por construção, não pelo LLM
# ---------------------------------------------------------------------------
invariants:
  INV-1_admin_ptBR_menu_completo:
    status: verified
    evidence: >-
      payload.config.ts: i18n.fallbackLanguage 'pt' + supportedLanguages {pt,en};
      collections sem admin.hidden/group. Runtime confirmou admin lang="pt".
  INV-2_modulo_igual_collection:
    status: verified
    evidence: >-
      payload.config registra collections; FR-011 trava LLM a editar só
      src/collections/ e labels. Runtime: collection Produtos (pt-BR) criada como
      collection e /api/produtos registrado no menu.
  INV-3_postgres_redis:
    status: verified
    evidence: >-
      .mosk-infra/docker-compose.yml: postgres:16-alpine + redis:7-alpine na
      mosk-net; payload.config usa postgresAdapter. Runtime: pg_isready+redis ping OK.
  INV-4_zero_build_local:
    status: verified
    evidence: >-
      compose do projeto só serviço app (node:22-bookworm-slim, sem build);
      payload-env.sh só valida/instala Docker com confirmação explícita.
  INV-5_grill_so_regra_de_negocio:
    status: verified_by_contract
    evidence: >-
      bench.md/bench-mode.md: pergunta só regra de negócio; bifurcação técnica =>
      default seguro + aviso (FR-014). Contrato de prompt; não há suite automatizada.
  INV-6_saida_ptBR_simples:
    status: verified_by_contract
    evidence: >-
      bench.md proíbe jargão/porta/DB/YAML/comando ao leigo; entrega e resumos
      CONCERNS em pt-BR. Contrato de prompt.

