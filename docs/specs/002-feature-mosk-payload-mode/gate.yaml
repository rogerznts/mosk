  FR-012_021_iteracao_aditiva: { status: verified_by_contract, evidence: "bench-mode.md Fase 6: pula scaffold, spec aditiva N via create-new-feature.sh, reusa registry. Não exercitado em runtime multi-ciclo." }
  FR-019_testes_local_api: { status: verified, evidence: "smoke.test.ts (Vitest/Local API). Runtime: suíte acumulada 5/5 (smoke 4 + módulo 1)." }
  FR-020_022_025_faseB_loop_autoescalacao: { status: mostly_verified, evidence: "bench-mode.md define RAPC + seam invoke_phase_agent (Tier 1/2), MAX_FIX_ATTEMPTS=3, decisions-log.md, qa-gate. Smoke pós-gate exercitou o loop-until-green de verdade: regra 'só admin exclui' virou teste, tentativa 1 VERMELHA (comum excluía), tentativa 2 VERDE (access.delete), suíte 6/6, decisions-log.md/build-log.md/gate-smoke.yaml gerados. Resta não-observado: o fan-out po→dev→qa AO VIVO via subagentes reais." }
  FR-030_paridade_runtime: { status: verified_by_contract, evidence: "ADR-0004: contrato de fases agnóstico + isolamento como capacidade (Tier1 estrutural / Tier2 lógico). Paridade Codex não exercitada em runtime." }
  FR-034_starter: { status: verified, evidence: "22 arquivos + pnpm-lock.yaml (5642 linhas) versionados; next 15.3.9 + @payloadcms/translations pinados; compose usa pnpm install --frozen-lockfile (validado: 'Lockfile is up to date'). Reprodutibilidade garantida." }
  FR-037_sync_camadas: { status: verified, evidence: "sync-agents-skills.sh --clean rodado (T023); cross-refs skill↔agente↔task válidas." }

top_issues:
  - id: FASEB-001
    severity: low   # high → low após smoke; agora validado ao vivo
    status: resolved
    finding: >-
      O loop-until-green da Fase B com fan-out po→dev→qa era contrato de prompt.
      Foi (1) provado por smoke manual (red→green + teto) e (2) validado AO VIVO
      com subagentes reais e headless: um mosk-dev implementou a collection
      Clientes + 2 regras de negócio (email único; só admin exclui) levando a
      suíte a 7/7 verde, e um mosk-qa independente deu PASS confirmando as regras
      no código. Isolamento Tier-1 confirmado (output dos subagentes não vazou ao
      contexto pai).
    affects: [FR-020, FR-022, FR-025, FR-026, SC-004]
    action: >-
      RESOLVIDO. Monitor residual: fase `po` (plan/tasks) e o galho de
      auto-escalação dev→architect não foram exercitados neste smoke (só dev→qa).
  - id: STARTER-002
    severity: medium
    status: resolved
    finding: >-
      pnpm-lock.yaml não versionado no starter, contrariando FR-034. RESOLVIDO:
      lock (5642 linhas) versionado e compose migrado para --frozen-lockfile
      (validado 'Lockfile is up to date').
    affects: [FR-034, FR-005]
    action: "RESOLVIDO."
  - id: DEGIT-003
    severity: medium
    status: resolved
    finding: >-
      Validado com `npx degit rogerznts/mosk/mosk#002-feature-mosk-payload-mode`
      REAL: a árvore materializa do GitHub (skill/task/agente/starter/scripts +
      pnpm-lock.yaml + pins corrigidos), a infra sobe pelo script puxado, o app
      boota com "Lockfile is up to date" e o smoke passa 4/4. Falta só o merge
      para master (será o PR) para o degit sem `#branch` refletir o modo.
    affects: [FR-030, T025]
    action: "Merge para master via PR; degit da default branch passa a servir o modo."
  - id: CODEX-004
    severity: low
    status: mitigated
    finding: >-
      Codex CLI presente (codex-cli 0.144.6). Paridade estrutural validada num
      consumer: link-codex-skills.sh cria `.codex/skills/mosk-bench` e insere a
      entrada `/mosk-bench` no AGENTS.md gerado. Não coberto: rodar o modo AO VIVO
      numa sessão Codex para observar o isolamento Tier-2 (ADR-0004).
    affects: [FR-030, T024]
    action: "Monitor: validar o isolamento Tier-2 numa sessão Codex real quando conveniente."

