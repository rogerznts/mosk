# MOSK quality gate template
template:
  id: qa-gate-template-v1
  name: Quality Gate Decision
  version: 1.0
  output:
    format: yaml
    filename: qa.qaLocation/gates/{{epic_num}}.{{story_num}}-{{story_slug}}.yml
    title: "Quality Gate: {{epic_num}}.{{story_num}}"

# Required fields (keep these first)
schema: 2
story: "{{epic_num}}.{{story_num}}"
story_title: "{{story_title}}"
gate: "{{gate_status}}" # PASS|CONCERNS|FAIL|WAIVED
quality_score: {{quality_score}} # 0-100. OBSERVAÇÃO, não gatilho: ver abaixo.
score_history: [{{score_history}}] # série das voltas, do primeiro gate ao atual
status_reason: "{{status_reason}}" # 1-2 sentence summary of why this gate decision
reviewer: "Quinn (Test Architect)"
updated: "{{iso_timestamp}}"
evidence_ref: "qa-notes.md" # caminho relativo à spec; obrigatório no schema 2

# Sobre `quality_score`:
# - CALCULADO, não estimado, pela fórmula canônica em
#   ../data/qa-evidence-contract.md:
#       quality_score = 100 - (20 × FAILs) - (10 × CONCERNS), limitado a [0,100]
#   Pesos customizados em technical-preferences.md sobrescrevem.
# - `gate` é o ÚNICO árbitro. O score não decide nada sozinho.
# - Ele existe para tornar a TRAJETÓRIA visível entre voltas: dois FAIL com
#   score parado sinalizam estagnação — hora de escalar, não de tentar de novo;
#   dois FAIL com score subindo sinalizam convergência lenta. Isso só funciona
#   porque o número vem de contagem, não de nova apreciação a cada rodada.
# - O corte de referência vem de `qa.score_threshold` no core-config (default 85).
#
# Sobre `score_history`: este arquivo é REESCRITO a cada volta do gate, então um
# score que não for acumulado aqui se perde. Faça append do score da rodada —
# é essa série que a task apresenta ao humano junto do veredito. Ex.: [61, 68, 69]

# Always present. Shell-legible top-level scalars are deliberate: archive and
# ship-ready validate these fields without pulling a YAML dependency.
waiver_active: false
waiver_reason: ""
waiver_approved_by: ""
waiver_approved_at: "" # ISO 8601 UTC; required when gate=WAIVED

# Issues (if any) - Use fixed severity: low | medium | high
#
# Cada issue carrega `title` (linguagem simples) e `contradicts` (o criterio
# violado COM a glossa). Sem a glossa, `contradicts: SC-004` obriga quem le a
# abrir a spec para saber se aquilo importa — ver `../data/output-contract.md`.
# Ids sao ESTAVEIS dentro da spec: QA-1 na 2a volta e o mesmo defeito da 1a.
top_issues: []

# Risk summary (from assess-risk task if run)
risk_summary:
  totals: { critical: 0, high: 0, medium: 0, low: 0 }
  recommendations:
    must_fix: []
    monitor: []

# Examples section using block scalars for clarity
examples:
  with_issues: |
    top_issues:
      - id: "QA-1"                 # vocabulario canonico: QA-# (gate), SEC-# (seguranca)
        severity: high             # ONLY: low|medium|high (schema nao se traduz)
        title: "Login aceita tentativas sem limite"   # linguagem simples, se sustenta sozinho
        finding: "Nenhum rate limit no endpoint de login (auth/login.ts:42-68)"
        contradicts: 'NFR-002 - "resistir a forca bruta em autenticacao"'  # id + GLOSSA
        suggested_action: "Adicionar middleware de rate limiting antes de producao"
      - id: "QA-2"
        severity: medium
        title: "Fluxo de auth nunca exercitado de ponta a ponta"
        finding: "Zero testes de integracao cobrindo login -> sessao -> logout"
        contradicts: 'SC-002 - "fluxo de auth verificado automaticamente"'
        suggested_action: "Cobrir os caminhos criticos com teste de integracao"

  when_waived: |
    waiver_active: true
    waiver_reason: "Accepted for MVP release - will address in next sprint"
    waiver_approved_by: "Product Owner"
    waiver_approved_at: "2026-08-15T17:30:00Z"

# ============ Optional Extended Fields ============
# Uncomment and use if your team wants more detail

optional_fields_examples:
  expiry: |
    expires: "2025-01-26T00:00:00Z"  # Optional gate freshness window

  evidence: |
    evidence:
      tests_reviewed: 15
      risks_identified: 3
      trace:
        ac_covered: [1, 2, 3]  # AC numbers with test coverage
        ac_gaps: [4]  # AC numbers lacking coverage

  nfr_validation: |
    nfr_validation:
      security: { status: CONCERNS, notes: "Rate limiting missing" }
      performance: { status: PASS, notes: "" }
      reliability: { status: PASS, notes: "" }
      maintainability: { status: PASS, notes: "" }

  history: |
    history:  # Append-only audit trail
      - at: "2025-01-12T10:00:00Z"
        gate: FAIL
        note: "Initial review - missing tests"
      - at: "2025-01-12T15:00:00Z"  
        gate: CONCERNS
        note: "Tests added but rate limiting still missing"

  risk_summary: |
    risk_summary:  # From assess-risk task
      totals:
        critical: 0
        high: 0
        medium: 0
        low: 0
      # 'highest' is emitted only when risks exist
      recommendations:
        must_fix: []
        monitor: []

  recommendations: |
    recommendations:
      immediate:  # Must fix before production
        - action: "Add rate limiting to auth endpoints"
          refs: ["api/auth/login.ts:42-68"]
      future:  # Can be addressed later
        - action: "Consider caching for better performance"
          refs: ["services/data.service.ts"]
