# Compose do PROJETO — sobe APENAS o serviço `app` (Payload/Next), sem build (ADR-0003, FR-010).
# Postgres, Redis e a rede `mosk-net` vêm da infra COMPARTILHADA
# (~/projects/.mosk-infra/), provisionada por payload-infra.sh (ADR-0001).
#
# INVARIANTE (INV-4): imagem pinada, zero build local. O código é montado
# como volume; a primeira subida roda `pnpm install --frozen-lockfile` (demora
# um pouco) e `node_modules` fica num volume nomeado para as próximas subidas
# serem rápidas. O `pnpm-lock.yaml` é versionado no starter (FR-034), então a
# instalação é reprodutível entre máquinas/datas.

services:
  app:
    image: node:22-bookworm-slim
    working_dir: /app
    # corepack habilita o pnpm que já vem com a imagem do Node 22.
    # --frozen-lockfile: falha se package.json divergir do lock (reprodutível).
    command: sh -c "corepack enable && pnpm install --frozen-lockfile && pnpm dev"
    ports:
      - "${ADMIN_PORT}:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: development
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    networks:
      - mosk-net
    restart: unless-stopped

volumes:
  node_modules:

networks:
  # A rede é criada pela infra compartilhada (.mosk-infra); aqui só entramos nela.
  mosk-net:
    external: true
