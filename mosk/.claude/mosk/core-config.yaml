markdownExploder: true
specs:
  root: docs/specs
  archive: docs/specs/archive
  storiesSubdir: stories
  testsSubdir: tests
  gateFile: gate.yaml
  metaFile: spec-meta.yaml
discovery:
  root: docs/discovery
prd:
  root: docs/prd
  indexFile: docs/prd/index.md
architecture:
  root: docs/architecture
  indexFile: docs/architecture/index.md
  adrDir: docs/architecture/adr
ui:
  root: docs/ui
  indexFile: docs/ui/index.md
qa:
  qaLocation: docs/qa
  gatesDir: docs/qa/gates
  assessmentsDir: docs/qa/assessments
  # Corte de referência do `quality_score` do gate (0-100). É OBSERVAÇÃO, não
  # gatilho: o veredito do gate (PASS/CONCERNS/FAIL/WAIVED) é que decide, sempre.
  # O corte serve para ler a trajetória do score entre uma volta e a seguinte.
  score_threshold: 85
project:
  root: docs/project
  livingFile: docs/project/plan.md
  updatePattern: docs/project/update-YYYYMMDD.md
  manual: docs/discovery/project-manual.md
index:
  file: docs/index.md
  template: .claude/mosk/templates/docs-index-tmpl.md
promotion:
  defaults:
    "specs/*/architecture/adr-*.md": { target: docs/architecture/adr/, mode: copy }
    "specs/*/ui/flows/*.md":          { target: docs/ui/flows/,       mode: copy }
    "specs/*/prd-delta.md":           { target: docs/prd/,             mode: manual }
slashPrefix: MOSK
