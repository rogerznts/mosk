# pipeline-graph.yaml — fonte única do grafo de ORQUESTRAÇÃO do MOSK.
#
# INVARIANTE (ADR-0006): este grafo NÃO executa transições. Ele computa o
# conjunto de jogadas legais a partir da fase atual e as entrega ao humano
# decidir (go / escalate / skip / override). Nenhum agente invoca outro
# automaticamente. `core-config.yaml` aponta para este arquivo; index-docs
# renderiza o mermaid A PARTIR daqui (o desenho é derivado, não paralelo).
#
# SCHEMA "shell-legível" (ADR-0007): UM registro por linha, em flow style
# do YAML. É YAML válido (agentes e yq leem nativo) e trivialmente parseável
# por awk/grep (sem parser aninhado, zero-dep). Regra invariante de autoria:
# nunca quebrar um registro em múltiplas linhas. O lint valida isso
# (scripts/lint-graph.sh).

version: 1

# ── Nós ────────────────────────────────────────────────────────────────
# kind: phase     → o ponteiro (current_phase) ocupa; update_spec_phase valida.
# kind: side-trip → alcançável a partir de uma fase, mas o ponteiro NÃO entra.
# mode: skill (contexto compartilhado, interativo) | agent (isolado, paralelo)
nodes:
  discovery:       { kind: side-trip, agent: mosk-analyst,   mode: skill, optional: true }
  prd:             { kind: side-trip, agent: mosk-pm,         mode: skill, optional: true }
  architecture:    { kind: side-trip, agent: mosk-architect,  mode: skill, optional: true }
  ux:              { kind: side-trip, agent: mosk-ux-expert,  mode: skill, optional: true, parallel_with: ui }
  ui:              { kind: side-trip, agent: mosk-ui-expert,  mode: skill, optional: true, parallel_with: ux }
  specify:         { kind: phase,     agent: mosk-po,         mode: skill }
  plan:            { kind: phase,     agent: mosk-po,         mode: skill }
  tasks:           { kind: phase,     agent: mosk-po,         mode: skill }
  clarify:         { kind: side-trip, agent: mosk-po,         mode: skill, optional: true }
  readiness:       { kind: side-trip, agent: mosk-sm,         mode: skill, optional: true }
  implement:       { kind: phase,     agent: mosk-dev,        mode: skill }
  security-review: { kind: side-trip, agent: mosk-security,   mode: agent, optional: true }
  qa-gate:         { kind: phase,     agent: mosk-qa,         mode: skill }
  archived:        { kind: phase,     terminal: true }

# ── Arestas ────────────────────────────────────────────────────────────
# from → to, com guard opcional (avaliado pela task de origem). Se o guard
# vale, a aresta é OFERECIDA — nunca tomada sozinha. default:true marca o
# caminho feliz (jogada sugerida primeiro).
edges:
  - { from: __start__, to: specify,   guard: base_ready,   default: true }
  - { from: __start__, to: discovery, guard: base_missing }
  - { from: discovery,    to: prd,          guard: request_vague }
  - { from: discovery,    to: specify,      default: true }
  - { from: prd,          to: architecture, guard: architecture_heavy }
  - { from: prd,          to: ux,           guard: ux_heavy }
  - { from: prd,          to: ui,           guard: design_heavy }
  - { from: prd,          to: specify,      default: true }
  - { from: architecture, to: specify }
  - { from: ux,           to: specify }
  - { from: ui,           to: specify }
  - { from: specify,   to: plan,      default: true }
  - { from: plan,      to: tasks,     default: true }
  - { from: tasks,     to: readiness, guard: stories_need_review }
  - { from: tasks,     to: implement, default: true }
  - { from: readiness, to: implement, default: true }
  - { from: implement,       to: security-review, guard: diff_security_sensitive }
  - { from: security-review, to: qa-gate,         default: true }
  - { from: implement,       to: qa-gate,         default: true }
  - { from: qa-gate, to: implement, guard: gate_concerns_or_fail }
  - { from: qa-gate, to: archived,  guard: gate_pass, default: true }

# ── Escalações ───────────────────────────────────────────────────────
# Saltos para um side-trip de preâmbulo e VOLTA (return_to: origin). São os
# blocos "Escalation suggested" formalizados. Semântica de ida-e-volta,
# diferente das arestas (ida só) — por isso ficam à parte.
escalations:
  - { signal: missing_adr,      from: [plan, tasks, implement, qa-gate],          to: architecture, return_to: origin, scope: spec }
  - { signal: unspecified_flow, from: [specify, plan, implement],                 to: ux,           return_to: origin, scope: spec }
  - { signal: design_gap,       from: [specify, plan, implement],                 to: ui,           return_to: origin, scope: spec }
  - { signal: prd_conflict,     from: [specify, plan, tasks, implement, qa-gate], to: prd,          return_to: origin, scope: spec }

# ── Guards ─────────────────────────────────────────────────────────────
# kind: fact     → avaliado mecanicamente pelo shell (verificável em disco).
# kind: judgment → avaliado pelo agente dono da fase, no prompt.
# O grafo NUNCA toma a aresta: apresenta a jogada + a resposta do guard.
guards:
  base_ready:              { kind: fact,     question: "Existe docs/prd/ nao-vazio (base do projeto pronta)?" }
  base_missing:            { kind: fact,     question: "A base do projeto (docs/prd/) esta ausente ou incompleta?" }
  request_vague:           { kind: judgment, question: "O pedido esta vago, sem brief/PRD que o sustente?" }
  architecture_heavy:      { kind: judgment, question: "A mudanca exige decisao arquitetural (boundaries, contratos, integracao)?" }
  ux_heavy:                { kind: judgment, question: "A mudanca exige fluxo/wireframe ainda nao especificado?" }
  design_heavy:            { kind: judgment, question: "A mudanca exige acabamento visual ou peca de design system?" }
  stories_need_review:     { kind: judgment, question: "As stories existem mas ainda nao passaram por readiness?" }
  diff_security_sensitive: { kind: judgment, question: "O diff toca superficie sensivel (auth, input, query, secrets, endpoints, desserializacao, cripto, path)?" }
  gate_pass:               { kind: fact,     question: "O gate.yaml tem status PASS ou WAIVED?" }
  gate_concerns_or_fail:   { kind: fact,     question: "O gate.yaml tem status CONCERNS ou FAIL?" }
